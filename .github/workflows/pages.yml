name: pages
# The game lives at https://playmaker-game.github.io (built from this repo by playmaker-game/playmaker-game.github.io).
# This keeps the old address (yandouziyassine.github.io/playmaker/) alive as a redirect that keeps path, query and #code=.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/redirect-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist-redirect }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
